        body, html {
            margin: 0;
            padding: 0;

            height: 100%;
            background-color: black;
            overflow: hidden;
        }

        .container {
            display: flex;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .scrolling-logo {
            white-space: nowrap;
            animation: scrollBanner linear infinite;
            animation-duration: 25s;  /* 调整为25秒，更慢（可按需增减） */

            display: flex;

        }

        .scrolling-logo img {
            height: 100vh;            /* 填满屏幕高度 */
            width: auto;
            display: inline-block;
            margin-right: 5vw;        /* 图片间距，保持比例 */
        }

        @keyframes scrollBanner {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
